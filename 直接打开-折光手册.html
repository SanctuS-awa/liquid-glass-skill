<main><section class="hero" aria-labelledby="headline"><div class="intro"><div class="eyebrow"><span></span> INTERFACE MATERIALS <b>/ 01</b></div><h1 id="headline">Liquid<br><em>Glass</em><i>.</i></h1><h2>把界面变成一枚透镜。</h2><p>一份给 AI 和开发者的液态玻璃规范。从边缘如何折光，到如何识破一层磨砂，设计与验收用同一套语言。</p><button id="command" type="button" aria-controls="glassBody"><span id="cmdText">收起标本</span><span aria-hidden="true" id="cmdArrow">↗</span></button></div>

</main><script>
"use strict";

const wallpaperSource = String.raw`
uniform vec2 uSize;
uniform float uTime, uScale;
uniform int uPlate, uProbes, uCase;
uniform vec4 uFixture;
uniform vec2 uMarkers[4];
uniform vec2 uShift;
uniform vec3 uContactColor;

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}
float band(float d, float width) {
  return exp(-pow(d / width, 2.0));
}
float segment(vec2 p, vec2 a, vec2 b) {
  vec2 ab=b-a;
  return length(p-a-ab*clamp(dot(p-a,ab)/dot(ab,ab), 0.0, 1.0));
}
float line(float d, float width) {
  return 1.0-smoothstep(width-.4,width+.6,d);
}
float spot(vec2 p, vec2 center, float radius) {
  return 1.0-smoothstep(radius-.8,radius+.35,length(p-center));
}
vec3 nightTide(vec2 coord) {
  vec2 p=(coord*2.0-uSize)/uSize.y;
  float t=uTime*6.2831853/16.0;
  float x=p.x;
  float y=p.y;
  float flow=-.035-0.255*x+0.19*sin(2.05*x+.62+0.53*sin(t))
             +.14*sin(3.03*x-0.78+0.29*cos(t))+.088*cos(t+.75*x);
  float noiseFold=noise(vec2(1.6*x,1.55*y)+vec2(.33*cos(t),.35*sin(t)));
  vec3 rgb=mix(vec3(.0025,.010,.016),vec3(.004,.029,.036),
               .7*band(y-flow,.51)+.2*band(x-.5,1.5));
  float drift=.033*sin(9.5*x+.32*sin(t))+.015*cos(17.0*x-2.1*y+.30*cos(t));
  float fold=y-flow+drift;
  float width=.17+.035*sin(2.3*x+sin(t)*.34)+.018*cos(4.0*x+.42);
  float body=band(fold,width);
  float wave=fold/width;
  float rolls=.5+.5*cos(20.5*wave+2.9*sin(x*3.4+.48*sin(t))+9.0*noiseFold);
  float sheer=.5+.5*sin(59.0*wave+4.4*sin(x*5.3+.24*cos(t))+2.8*noiseFold);
  float crest=band(fold-.055+.027*sin(4.8*x),.025);
  float crestRim=band(fold-.047+.027*sin(4.8*x),.0041);
  float primary=(.28+.72*smoothstep(-1.38,.82,x))*(.77+.23*cos(x*3.4-.61));
  vec3 jade=mix(vec3(.012,.265,.206),vec3(.018,.195,.36),smoothstep(.04,1.15,x));
  rgb+=jade*primary*body*(.26+.41*pow(rolls,3.2)+.12*pow(sheer,6.0));
  rgb+=mix(vec3(.04,.60,.44),vec3(.05,.43,.70),smoothstep(.15,1.14,x))
      *primary*(crest*(.17+.07*sheer)+crestRim*(.22+.31*pow(rolls,2.0)));
  float other=y-flow+.237+.12*cos(x*2.2-.43*cos(t))+.055*sin(x*4.2-.31);
  float violet=band(other,.105);
  float filaments=pow(.5+.5*sin(131.0*other+4.0*sin(4.5*x)+3.0*noiseFold),6.0);
  rgb+=vec3(.031,.093,.179)*violet*(.22+.38*filaments)*(.46+.54*smoothstep(-1.3,.95,x));
  rgb+=vec3(.028,.185,.42)*band(other-.043,.013)*(.36+.64*filaments)
      *smoothstep(-.52,.95,x);
  float copper=y-.43+.215*x+.08*sin(x*3.1+.5+.46*sin(t))+.06*sin(x*6.5+.31*cos(t));
  float copperEnv=band(x+.28,1.00)*smoothstep(.06,.7,noiseFold);
  float copperLine=band(copper,.018)+.25*band(copper+.029,.047);
  rgb+=vec3(.67,.148,.043)*copperEnv*(copperLine*.24+band(copper+.006,.0045)*.56)
      *(.64+.36*sin(12.0*x+.71*sin(t)));
  float angled=y-flow-.18-.055*cos(x*2.3+.45*cos(t));
  rgb+=vec3(.015,.097,.067)*band(angled,.12)*pow(.5+.5*sin(71.0*angled+3.0*sin(1.9*x)+5.0*noiseFold),4.0);
  float dust=hash(floor(coord))-.5;
  rgb*=.83+.17*noise(coord*.105)+.09*dust;
  rgb+=max(0.0,dust)*.003;
  float vignette=1.0-.35*smoothstep(.37,1.18,length(vec2(x*.53,y*.80)));
  return rgb*vignette;
}
vec3 diagnostic(vec2 p) {
  vec2 c=uFixture.xy, d=p-c;
  vec2 halfSize=uFixture.zw;
  vec3 rgb=vec3(.014,.027,.032);
  if(uPlate == 3) return vec3(.07);
  if(uPlate == 1 || uPlate == 4) {
    if(uCase == 0) {
      float slope=(d.y+.46*d.x);
      float grid=abs(mod(slope+16.0,51.0)-25.5);
      rgb+=vec3(.025,.043,.051)*line(grid,1.1);
      if(uPlate==1) {
        rgb+=vec3(.022,.083,.08)*line(abs(slope-5.0),9.0);
        rgb+=vec3(.071,.125,.147)*line(abs(slope-14.0),2.2);
      }
    }
    if(uPlate == 1) {
      if((uProbes & 1) != 0) rgb=mix(rgb,vec3(.81,.54,.13),spot(p,uMarkers[0],4.1));
      if((uProbes & 2) != 0) rgb=mix(rgb,vec3(.05,.62,.81),spot(p,uMarkers[1],4.1));
      rgb=mix(rgb,vec3(.86,.31,.15),spot(p,uMarkers[2],3.1));
      rgb=mix(rgb,vec3(.65,.79,.17),spot(p,uMarkers[3],3.1));
    } else {
      if((uProbes & 1) != 0) rgb=mix(rgb,vec3(.90,.27,.034),spot(p,uMarkers[0]+uShift,6.3));
      if((uProbes & 2) != 0) rgb=mix(rgb,vec3(.038,.42,.97),spot(p,uMarkers[1],6.3));
    }
    return rgb;
  }
  if(uPlate == 2) {
    rgb=vec3(.0035,.005,.0065);
    float texture=.5+.5*cos((d.x*.78+d.y*.61)*2.48);
    float softBand=line(abs(d.y-0.289*d.x+.23*halfSize.y),11.0);
    float sideBand=line(abs(d.y-0.289*d.x+.84*halfSize.y),9.0);
    float cornerWaves=line(abs(d.y+0.315*d.x-.47*halfSize.y),9.0);
    rgb+=vec3(.022,.031,.036)*(softBand+sideBand+cornerWaves)*(.09+.91*texture);
    vec2 a=c+vec2(-halfSize.x*.43,halfSize.y*.28);
    vec2 b=c+vec2(halfSize.x*.43,halfSize.y*.28);
    rgb+=vec3(.91,.67,.40)*line(segment(p,a+vec2(-12,0),a+vec2(12,0)),3.1);
    rgb+=vec3(.118,.086,.052)*line(segment(p,b+vec2(-12,0),b+vec2(12,0)),3.1);
    return rgb;
  }
  rgb=uCase==3?vec3(.013,.062,.055):vec3(.020,.030,.035);
  if(uCase == 1) return uContactColor;
  if((uProbes & 1) != 0) rgb=mix(rgb,uContactColor,spot(p,uMarkers[0],7.0));
  return rgb;
}
void main() {
  vec3 rgb=uPlate==0?nightTide(gl_FragCoord.xy):diagnostic(gl_FragCoord.xy/uScale);
  dst=vec4(max(vec3(0.0),rgb),1.0);
}
`;

</script><script>
"use strict";
window.RimLight = (() => {
  const white=.819;
  const clamp=(v,lo=0,hi=1)=>Math.max(lo,Math.min(hi,v));
  const smooth=v=>{const t=clamp(v);return t*t*(3-2*t);};
  // Shared by GPU and CPU. Coordinates refer to an isotropic near-neighborhood,
  // never to the previously recolored L4 or contact-gated L6.
  const kernel=[
    [0,0,4], [-.5,0,3],[.5,0,3],[-1,0,1],[1,0,1],
    [-.50,-.50,2],[0,-.5,3],[.50,-.50,2],
    [-.50,.50,2],[0,.5,3],[.50,.50,2],
    [0,-1,1],[0,1,1],
  ];
  const total=kernel.reduce((sum,entry)=>sum+entry[2],0);
  const radius=g=>6+15*Math.min(g.width,g.height)/(Math.min(g.width,g.height)+136);
  function gain(x,y,nx,ny,d) {
    // The normal sets incidence, while a smooth light field varies along even perfectly flat edges.
    const direction=(x+y)*.50;
    const field=smooth(Math.abs(direction));
    const toward=(nx+ny)*Math.sign(direction)*.7071;
    const lit=field*(.79+.21*smooth(.5+.5*toward));
    const peak=.036+.745*lit;
    const core=.48+1.42*lit;
    const shoulder=.75+4.05*lit;
    const body=.19+.27*lit;
    const f=(1-body)*(1-smooth(d/core)) + body*(1-smooth(d/shoulder));
    return peak*f;
  }
  function ambient(r,g,b,out,at) {
    const y=.2126*r+.7152*g+.0722*b;
    const k=.50/Math.sqrt(.34+y);
    const limit=.176/Math.max(.176,k*(Math.max(r,g,b)-y));
    out[at]=white+(r-y)*k*limit;
    out[at+1]=white+(g-y)*k*limit;
    out[at+2]=white+(b-y)*k*limit;
    out[at+3]=1;
  }
  const glsl=String.raw`
    const vec3 luma=vec3(.2126,.7152,.0722);
    vec3 ambientLight(vec3 rgb) {
      float y=dot(rgb,luma);
      float k=.50/sqrt(.34+y);
      float limit=.176/max(.176,k*(max(rgb.r,max(rgb.g,rgb.b))-y));
      return vec3(${white})+(rgb-vec3(y))*k*limit;
    }
  `;
  return {gain,radius,kernel,total,ambient,glsl};
})();

</script><script>
"use strict";
// All glass shapes use one continuous material, with no component-specific presets.
window.L4Material = (() => {
  const cap = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const mix = (a, b, t) => a + (b-a)*t;
  const smooth = x => { const t=cap(x,0,1); return t*t*(3-2*t); };
  function resolve(shape, frame) {
    const s = Math.min(shape.width, shape.height);
    const legacy = Boolean(frame.legacyL4);
    const previous = Boolean(frame.previousL4);
    if (legacy || previous) {
      const base = legacy ? cap(1.65+s*.006,2.35,3.7) : 2.55 + 2.45*s/(s+115);
      return {fine:base,wide:base*(legacy?2.5:2.76),halo:legacy?cap(s*.061,9,21):9+13*s/(s+148),
        wideMix:frame.wideMix ?? (legacy?.43:.48),edgeWide:legacy?.56:.52,
        edgeSoft:legacy?.66:.62,faceSoft:legacy?.93:.98,glow:legacy?1.03:1.24};
    }
    const size = s/(s+114);
    const fine = 1.28 + 1.10*size;
    return {
      fine, wide:fine*2.55, halo:8+13*s/(s+152),
      wideMix:frame.wideMix ?? (.21+.08*size), edgeWide:.65,
      edgeSoft:.72, faceSoft:.94, glow:.58,
    };
  }
  function energy(peak, legacy, previous = false) {
    return legacy ? peak ** 1.4 : peak * smooth(previous ? (peak-.055)/.525 : (peak-.035)/.252);
  }
  function glow(blurredLight, raw, fine, wide, power, gain, legacy, previous = false) {
    if (legacy) return Math.max(0,blurredLight-raw*power*.74)*gain;
    const lifted = Math.max(0, blurredLight - raw*power);
    if (previous) return lifted * smooth((lifted-.00065)/.0032) *
      (1-.52*smooth(Math.abs(fine-wide)/.080))*gain;
    // Suppress the barely visible lower tail continuously and preserve bright shape edges.
    return lifted * smooth((lifted-.00025)/.00200)*gain;
  }
  return {resolve, energy, glow, mix};
})();

</script><script>
"use strict";

window.Tideline = (() => {
  const PI = Math.PI;
  const clamp = (value, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, value));
  const mod = (value, period) => (value % period + period) % period;
  const mix = (a, b, weight) => a + (b - a) * weight;
  const smooth = value => {
    const t = clamp(value);
    return t * t * (3 - 2 * t);
  };
  const tuning = {
    normalGain: .38,
    faceDepth: .46,
    faceGain: .37,
    rimWidth: .054,
    rimTravel: 1.92,
    wideBlurMix: .43,
    wideBlurRatio: 2.5,
    bloomStrength: 1.03,
    tintReach: .23,
    tintStrength: .93,
  };

  // Arclength starts at top centre and runs clockwise in CSS coordinates.
  function profile(width, height, radius) {
    const hx = width / 2;
    const hy = height / 2;
    const a = hx - radius;
    const b = hy - radius;
    const arc = PI * radius / 2;
    const q = a + b + arc;
    const perimeter = 4 * q;
    const short = Math.min(width, height);
