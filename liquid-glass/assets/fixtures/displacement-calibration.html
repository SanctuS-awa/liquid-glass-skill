<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>SVG 位移三帧校准</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#142029;color:#edf5f5;font:16px system-ui,sans-serif}main{max-width:1240px;margin:auto}
h1{font-size:27px}p{max-width:75ch;line-height:1.5}svg{display:block;width:100%;height:auto;background:#10181e;border-radius:10px}
section{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}h2{font-size:18px}label{display:inline-flex;gap:12px;align-items:center}
</style>
<main><h1>SVG 位移三帧校准</h1><p>在三幅同底图里对照小格与橙青标记；正确时，N 没有整体漂移，R 的中心不动而边缘改变。这是量具，不是完整液态玻璃。</p>
<label><input type="checkbox" id="bad">故意把 8 位 sRGB 中性图交给 linearRGB（负例）</label>
<br><label><input type="checkbox" id="badSize">故意让实际位移图的装载区域错位（负例）</label>
<section>
<article><h2>Z · 位移零</h2><div id="z"></div></article>
<article><h2>N · 中性图</h2><div id="n"></div></article>
<article><h2>R · 实际图</h2><div id="r"></div></article>
</section></main>
<script>
const params=new URLSearchParams(location.search);
const w=params.has('tall')?220:320, h=params.has('tall')?240:180;
const band=24,scale=38;
const ns='http://www.w3.org/2000/svg';
const ratio=params.has('hi')?2:1;
function map(neutral){
 const c=document.createElement('canvas');c.width=w*ratio;c.height=h*ratio;
 const ctx=c.getContext('2d');const a=ctx.createImageData(c.width,c.height);
 for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
  const X=(x+.5)/ratio,Y=(y+.5)/ratio;
  const dx=X-w/2,dy=Y-h/2,R=30,ax=Math.abs(dx)-(w/2-R),ay=Math.abs(dy)-(h/2-R);
  const xx=Math.max(ax,0),yy=Math.max(ay,0),q=Math.hypot(xx,yy);
  const d=R-q-Math.min(Math.max(ax,ay),0);
  const t=neutral?0:Math.max(0,Math.min(1,1-d/band))**2;
  const vx=q>0?xx/q*Math.sign(dx):ax>ay?Math.sign(dx):0;
  const vy=q>0?yy/q*Math.sign(dy):ay>=ax?Math.sign(dy):0;
  const p=(y*c.width+x)*4;
  a.data[p]=Math.round(128-vx*t*104);a.data[p+1]=Math.round(128-vy*t*104);a.data[p+2]=128;a.data[p+3]=255;
 }
 ctx.putImageData(a,0,0);return c.toDataURL();
}
const maps={actual:map(false),neutral:map(true)};
function draw(){
 for(const [id,strength,kind] of [['z',0,'actual'],['n',scale,'neutral'],['r',scale,'actual']]){
  const mode=document.getElementById('bad').checked?'linearRGB':'sRGB';
  const badSize=id==='r'&&document.getElementById('badSize').checked;
  document.getElementById(id).innerHTML=`<svg xmlns="${ns}" viewBox="0 0 ${w} ${h}" aria-label="${id.toUpperCase()} 位移网格">
  <defs><pattern id="grid-${id}" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#223940"/><path d="M0 0 H16 M0 0 V16" stroke="#789293" stroke-width="1"/></pattern>
  <filter id="lens-${id}" x="0" y="0" width="${w}" height="${h}" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="${mode}">
  <feImage href="${maps[kind]}" x="${badSize?w*.4:0}" y="0" width="${badSize?w*.45:w}" height="${h}" preserveAspectRatio="none" result="m"/><feDisplacementMap in="SourceGraphic" in2="m" scale="${strength}" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
  <g filter="url(#lens-${id})"><rect width="${w}" height="${h}" fill="url(#grid-${id})"/>
  <path d="M-12 ${h*.75} L${w+12} ${h*.26}" stroke="#52eee0" stroke-width="5"/>
  <path d="M-9 ${h*.22} L${w+9} ${h*.67}" stroke="#ffab69" stroke-width="4"/>
  <circle cx="${w/2}" cy="${h/2}" r="4" fill="white"/></g></svg>`;
 }
}
for(const id of ['bad','badSize'])document.getElementById(id).addEventListener('change',draw);draw();
</script>
